spring:
  application:
    name: BookingAPI

  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600